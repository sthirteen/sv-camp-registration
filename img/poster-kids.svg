<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-label="Kids Discovery Camp poster">
  <defs>
    <linearGradient id="skyk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0A3A46"/>
      <stop offset="52%"  stop-color="#157A88"/>
      <stop offset="100%" stop-color="#54C4C8"/>
    </linearGradient>
    <linearGradient id="sunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF1B8"/>
      <stop offset="100%" stop-color="#F5C558"/>
    </linearGradient>
    <clipPath id="clipk"><rect width="660" height="300" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#clipk)">
    <rect width="660" height="300" fill="url(#skyk)"/>

    <!-- sun / moon: same size and place on every poster -->
    <circle cx="330" cy="112" r="86" fill="#FFF1B8" opacity=".16"/>
    <circle cx="330" cy="112" r="58" fill="url(#sunk)" opacity=".95"/>

    <g fill="#FFFFFF" opacity=".2"><ellipse cx="140" cy="62" rx="44" ry="14"/><ellipse cx="178" cy="55" rx="30" ry="12"/><ellipse cx="520" cy="76" rx="38" ry="12"/></g>

    <!-- back ridge, then front ridge: same heights on every poster -->
    <path d="M0 182 L118 128 L226 180 L330 122 L438 180 L548 132 L660 184 L660 300 L0 300 Z"
          fill="#0C4C55"/>
    <path d="M0 216 L132 176 L262 220 L392 172 L512 218 L660 180 L660 300 L0 300 Z"
          fill="#083840"/>

    <!-- the motif sits in the same band on every poster -->
    <g transform="translate(300,208.12)"><circle cx="0" cy="0" r="6.6" fill="#FFF3D6"/><path d="M0 6.6 L0 18 M0 10 L-9 16 M0 10 L9 16 M0 18 L-7 28 M0 18 L7 28" stroke="#FFF3D6" stroke-width="3.6" stroke-linecap="round" fill="none"/></g><g transform="translate(360,211.52)"><circle cx="0" cy="0" r="5.8" fill="#FFF3D6"/><path d="M0 5.8 L0 16 M0 9 L-8 14 M0 9 L8 14 M0 16 L-6 24 M0 16 L6 24" stroke="#FFF3D6" stroke-width="3.2" stroke-linecap="round" fill="none"/></g><g transform="translate(470,150)"><path d="M0 0 C-24 -26 -50 -18 -45 3 C-42 19 -18 21 0 6 Z" fill="#FFC93C"/><path d="M0 0 C24 -26 50 -18 45 3 C42 19 18 21 0 6 Z" fill="#FFB01F"/><path d="M0 -8 L0 20" stroke="#3A2A08" stroke-width="3.5" stroke-linecap="round"/></g>

    <!-- foreground: same shape and height throughout -->
    <ellipse cx="330" cy="262" rx="200" ry="26" fill="#1F8E96"/>
    <rect y="272" width="660" height="28" fill="#062A31"/>
  </g>
</svg>
