<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-label="Shalom Family Camp poster">
  <defs>
    <linearGradient id="skyf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7A2A0C"/>
      <stop offset="52%"  stop-color="#C25E22"/>
      <stop offset="100%" stop-color="#F2AE68"/>
    </linearGradient>
    <linearGradient id="sunf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="100%" stop-color="#FFD08A"/>
    </linearGradient>
    <clipPath id="clipf"><rect width="660" height="300" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#clipf)">
    <rect width="660" height="300" fill="url(#skyf)"/>

    <!-- sun / moon: same size and place on every poster -->
    <circle cx="330" cy="112" r="86" fill="#FFF3D6" opacity=".16"/>
    <circle cx="330" cy="112" r="58" fill="url(#sunf)" opacity=".95"/>

    <g fill="#FFFFFF" opacity=".2"><ellipse cx="140" cy="62" rx="44" ry="14"/><ellipse cx="178" cy="55" rx="30" ry="12"/><ellipse cx="520" cy="76" rx="38" ry="12"/></g>

    <!-- back ridge, then front ridge: same heights on every poster -->
    <path d="M0 182 L118 128 L226 180 L330 122 L438 180 L548 132 L660 184 L660 300 L0 300 Z"
          fill="#9C4218"/>
    <path d="M0 216 L132 176 L262 220 L392 172 L512 218 L660 180 L660 300 L0 300 Z"
          fill="#7A3210"/>

    <!-- the motif sits in the same band on every poster -->
    <g transform="translate(268,202.0)"><circle cx="0" cy="0" r="8.0" fill="#FFF1DC"/><path d="M0 8.0 L0 22 M0 12 L-11 20 M0 12 L11 20 M0 22 L-8 34 M0 22 L8 34" stroke="#FFF1DC" stroke-width="4.4" stroke-linecap="round" fill="none"/></g><g transform="translate(312,211.52)"><circle cx="0" cy="0" r="5.8" fill="#FFF1DC"/><path d="M0 5.8 L0 16 M0 9 L-8 14 M0 9 L8 14 M0 16 L-6 24 M0 16 L6 24" stroke="#FFF1DC" stroke-width="3.2" stroke-linecap="round" fill="none"/></g><g transform="translate(352,213.56)"><circle cx="0" cy="0" r="5.3" fill="#FFF1DC"/><path d="M0 5.3 L0 15 M0 8 L-7 13 M0 8 L7 13 M0 15 L-5 22 M0 15 L5 22" stroke="#FFF1DC" stroke-width="2.9" stroke-linecap="round" fill="none"/></g><g transform="translate(396,202.0)"><circle cx="0" cy="0" r="8.0" fill="#FFF1DC"/><path d="M0 8.0 L0 22 M0 12 L-11 20 M0 12 L11 20 M0 22 L-8 34 M0 22 L8 34" stroke="#FFF1DC" stroke-width="4.4" stroke-linecap="round" fill="none"/></g><g transform="translate(122,214)"><path d="M-46 22 L0 -12 L46 22 Z" fill="#8A3D16"/><rect x="-35" y="22" width="70" height="38" fill="#FFF1DC"/><rect x="-12" y="38" width="24" height="22" fill="#8A3D16"/></g>

    <!-- foreground: same shape and height throughout -->
    <rect x="236" y="240" width="248" height="34" rx="17" fill="#3FB3BC"/><g stroke="#E4FAFB" stroke-width="2.5" opacity=".5" fill="none"><path d="M266 256 q12 -6 24 0 t24 0"/></g>
    <rect y="272" width="660" height="28" fill="#5E240B"/>
  </g>
</svg>
