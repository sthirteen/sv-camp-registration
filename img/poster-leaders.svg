<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-label="Leaders Rest and Renewal Retreat poster">
  <defs>
    <linearGradient id="skyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0A1A2C"/>
      <stop offset="52%"  stop-color="#204A6B"/>
      <stop offset="100%" stop-color="#4986A6"/>
    </linearGradient>
    <linearGradient id="sunl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F1E2"/>
      <stop offset="100%" stop-color="#CFC3A8"/>
    </linearGradient>
    <clipPath id="clipl"><rect width="660" height="300" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#clipl)">
    <rect width="660" height="300" fill="url(#skyl)"/>

    <!-- sun / moon: same size and place on every poster -->
    <circle cx="330" cy="112" r="86" fill="#F7F1E2" opacity=".16"/>
    <circle cx="330" cy="112" r="58" fill="url(#sunl)" opacity=".95"/>

    <g fill="#FFFFFF" opacity=".55"><circle cx="86" cy="42" r="2.1"/><circle cx="168" cy="72" r="1.5"/><circle cx="512" cy="48" r="1.9"/><circle cx="592" cy="80" r="1.4"/><circle cx="248" cy="36" r="1.6"/><circle cx="430" cy="30" r="1.7"/></g>

    <!-- back ridge, then front ridge: same heights on every poster -->
    <path d="M0 182 L118 128 L226 180 L330 122 L438 180 L548 132 L660 184 L660 300 L0 300 Z"
          fill="#122C42"/>
    <path d="M0 216 L132 176 L262 220 L392 172 L512 218 L660 180 L660 300 L0 300 Z"
          fill="#0B1D2E"/>

    <!-- the motif sits in the same band on every poster -->
    <g transform="translate(330,202.0)"><circle cx="0" cy="0" r="8.0" fill="#F5EEDC"/><path d="M0 8.0 L0 22 M0 12 L-11 20 M0 12 L11 20 M0 22 L-8 34 M0 22 L8 34" stroke="#F5EEDC" stroke-width="4.4" stroke-linecap="round" fill="none"/></g>

    <!-- foreground: same shape and height throughout -->
    <rect y="244" width="660" height="30" fill="#0A1826"/><g fill="#F5EEDC" opacity=".18"><rect x="306" y="250" width="48" height="4" rx="2"/><rect x="314" y="260" width="32" height="3" rx="1.5"/></g>
    <rect y="272" width="660" height="28" fill="#061421"/>
  </g>
</svg>
