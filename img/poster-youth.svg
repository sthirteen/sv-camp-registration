<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-label="Youth Adventure Camp poster">
  <defs>
    <linearGradient id="skyy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#06231A"/>
      <stop offset="52%"  stop-color="#12563A"/>
      <stop offset="100%" stop-color="#2E8A5E"/>
    </linearGradient>
    <linearGradient id="suny" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE8A3"/>
      <stop offset="100%" stop-color="#F2A03C"/>
    </linearGradient>
    <clipPath id="clipy"><rect width="660" height="300" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#clipy)">
    <rect width="660" height="300" fill="url(#skyy)"/>

    <!-- sun / moon: same size and place on every poster -->
    <circle cx="330" cy="112" r="86" fill="#FFE8A3" opacity=".16"/>
    <circle cx="330" cy="112" r="58" fill="url(#suny)" opacity=".95"/>

    <g fill="#FFFFFF" opacity=".55"><circle cx="86" cy="42" r="2.1"/><circle cx="168" cy="72" r="1.5"/><circle cx="512" cy="48" r="1.9"/><circle cx="592" cy="80" r="1.4"/><circle cx="248" cy="36" r="1.6"/><circle cx="430" cy="30" r="1.7"/></g>

    <!-- back ridge, then front ridge: same heights on every poster -->
    <path d="M0 182 L118 128 L226 180 L330 122 L438 180 L548 132 L660 184 L660 300 L0 300 Z"
          fill="#0B3A28"/>
    <path d="M0 216 L132 176 L262 220 L392 172 L512 218 L660 180 L660 300 L0 300 Z"
          fill="#07291D"/>

    <!-- the motif sits in the same band on every poster -->
    <path d="M40 96 L620 66" stroke="#EAF7F0" stroke-width="2.5" opacity=".7"/><g transform="translate(330,202.0)"><circle cx="0" cy="0" r="8.0" fill="#EAF7F0"/><path d="M0 8.0 L0 22 M0 12 L-11 20 M0 12 L11 20 M0 22 L-8 34 M0 22 L8 34" stroke="#EAF7F0" stroke-width="4.4" stroke-linecap="round" fill="none"/></g><g><path d="M150 250 L188 194 L226 250 Z" fill="#F2A03C"/><path d="M188 194 L188 250" stroke="#B3641A" stroke-width="3.5"/><path d="M222 250 L258 200 L294 250 Z" fill="#EAF7F0" opacity=".9"/></g><g transform="translate(486,240)"><path d="M0 -22 C10 -12 12 -4 6 4 C2 9 -2 9 -6 4 C-12 -4 -10 -12 0 -22 Z" fill="#FFB33C"/><path d="M-16 10 L16 4 M-16 4 L16 10" stroke="#7A5C34" stroke-width="5" stroke-linecap="round"/></g>

    <!-- foreground: same shape and height throughout -->
    
    <rect y="272" width="660" height="28" fill="#04180F"/>
  </g>
</svg>
