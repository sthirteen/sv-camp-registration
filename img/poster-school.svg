<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-label="School Leadership Week poster">
  <defs>
    <linearGradient id="skys" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#241448"/>
      <stop offset="52%"  stop-color="#4E2E8E"/>
      <stop offset="100%" stop-color="#8A62C8"/>
    </linearGradient>
    <linearGradient id="suns" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9B8"/>
      <stop offset="100%" stop-color="#D9B36A"/>
    </linearGradient>
    <clipPath id="clips"><rect width="660" height="300" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#clips)">
    <rect width="660" height="300" fill="url(#skys)"/>

    <!-- sun / moon: same size and place on every poster -->
    <circle cx="330" cy="112" r="86" fill="#FFE9B8" opacity=".16"/>
    <circle cx="330" cy="112" r="58" fill="url(#suns)" opacity=".95"/>

    <g fill="#FFFFFF" opacity=".55"><circle cx="86" cy="42" r="2.1"/><circle cx="168" cy="72" r="1.5"/><circle cx="512" cy="48" r="1.9"/><circle cx="592" cy="80" r="1.4"/><circle cx="248" cy="36" r="1.6"/><circle cx="430" cy="30" r="1.7"/></g>

    <!-- back ridge, then front ridge: same heights on every poster -->
    <path d="M0 182 L118 128 L226 180 L330 122 L438 180 L548 132 L660 184 L660 300 L0 300 Z"
          fill="#33206B"/>
    <path d="M0 216 L132 176 L262 220 L392 172 L512 218 L660 180 L660 300 L0 300 Z"
          fill="#231452"/>

    <!-- the motif sits in the same band on every poster -->
    <g transform="translate(288,206.76)"><circle cx="0" cy="0" r="6.9" fill="#F0E9FF"/><path d="M0 6.9 L0 19 M0 10 L-9 17 M0 10 L9 17 M0 19 L-7 29 M0 19 L7 29" stroke="#F0E9FF" stroke-width="3.8" stroke-linecap="round" fill="none"/></g><g transform="translate(330,202.0)"><circle cx="0" cy="0" r="8.0" fill="#F0E9FF"/><path d="M0 8.0 L0 22 M0 12 L-11 20 M0 12 L11 20 M0 22 L-8 34 M0 22 L8 34" stroke="#F0E9FF" stroke-width="4.4" stroke-linecap="round" fill="none"/></g><g transform="translate(374,208.8)"><circle cx="0" cy="0" r="6.4" fill="#F0E9FF"/><path d="M0 6.4 L0 18 M0 10 L-9 16 M0 10 L9 16 M0 18 L-6 27 M0 18 L6 27" stroke="#F0E9FF" stroke-width="3.5" stroke-linecap="round" fill="none"/></g><g transform="translate(330,122)"><path d="M0 0 L0 -46" stroke="#FFD24A" stroke-width="4" stroke-linecap="round"/><path d="M2 -44 L40 -35 L2 -25 Z" fill="#FFD24A"/></g>

    <!-- foreground: same shape and height throughout -->
    
    <rect y="272" width="660" height="28" fill="#1B0F38"/>
  </g>
</svg>
